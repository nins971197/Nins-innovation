modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "truenins"
version = "${file.jarVersion}"
displayName = "Nins innovation"
authors = "TrueNinsTeam"
description = '''
Dual-channel perk system: every effect exists as an item NBT tag (commands) and
as an enchantment, with independent state per channel. Optional Iron's
Spells 'n Spellbooks integration adds the truenins:curse school.
'''
logoFile = "truenins.png"

[[dependencies.truenins]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.truenins]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.truenins]]
modId = "irons_spellbooks"
mandatory = false
versionRange = "[1.20.1-3.15.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "truenins.mixins.json"
