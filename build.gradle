plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mod_version}"
group = "${maven_group}"
base.archivesName = "truenins"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'truenins'
            mods {
                truenins {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'truenins'
            mods {
                truenins {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'truenins.refmap.json'
    config 'truenins.mixins.json'
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/central' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    def thirdParty = file('libs').listFiles()?.findAll { it.name.endsWith('.jar') } ?: []
    if (thirdParty.isEmpty()) {
        throw new GradleException(
            "libs/ is empty.\n" +
            "This addon compiles against Iron's Spells 'n Spellbooks and irons_lib, which are\n" +
            "other people's work and are deliberately NOT shipped with this repository.\n" +
            "Download them and drop the jars into libs/ - see libs/README.md for details.")
    }
    compileOnly fg.deobf(files(thirdParty))
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "truenins",
            "Specification-Vendor"    : "truenins",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "truenins"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
