plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mod_version}"
group = "${maven_group}"
base.archivesName = "truenins"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Opt-in local visual harness; never included in a normal release build.
if (project.hasProperty('visualCheck')) {
    sourceSets.main.java.srcDir 'src/visualCheck/java'
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'truenins'
            if (project.hasProperty('visualCheck')) {
                property 'truenins.visualCheck', 'true'
                if (project.hasProperty('judgmentCheck')) property 'truenins.judgmentCheck', 'true'
                if (project.hasProperty('conflagrationCheck')) property 'truenins.conflagrationCheck', 'true'
                args '--quickPlaySingleplayer', 'VisualCheck'
            }
            mods {
                truenins {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'truenins'
            mods {
                truenins {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'truenins.refmap.json'
    config 'truenins.mixins.json'
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/central' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/maven/' }
    flatDir { dirs 'libs' }
    if (project.hasProperty('ironRuntimeDir')) {
        flatDir { dirs project.property('ironRuntimeDir') }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    def thirdParty = file('libs').listFiles()?.findAll { it.name.endsWith('.jar') } ?: []
    if (thirdParty.isEmpty()) {
        throw new GradleException(
            "libs/ is empty.\n" +
            "This addon compiles against Iron's Spells 'n Spellbooks and irons_lib, which are\n" +
            "other people's work and are deliberately NOT shipped with this repository.\n" +
            "Download them and drop the jars into libs/ - see libs/README.md for details.")
    }
    thirdParty.each { jar ->
        def parts = (jar.name - '.jar') =~ /^(.+)-(\d[^-]*)$/
        if (parts.matches()) {
            compileOnly fg.deobf("libs:${parts[0][1]}:${parts[0][2]}")
        }
    }
    // Optional local integration run. These dependencies are never bundled into the mod or source ZIP.
    if (project.hasProperty('ironRuntimeDir')) {
        ['irons_spellbooks-1.20.1:3.16.3', 'irons_lib-1.20.1:2.1.0',
         'geckolib:4.8.4', 'curios:5.14.1', 'playeranimator:1.0.2'].each { artifact ->
            runtimeOnly fg.deobf("libs:${artifact}")
        }
    }
}

jar {
    exclude 'com/truenins/validation/**'
    manifest {
        attributes([
            "Specification-Title"     : "truenins",
            "Specification-Vendor"    : "truenins",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "truenins"
        ])
    }
}

sourcesJar {
    exclude 'com/truenins/validation/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('jar').configure { finalizedBy('reobfJar') }

tasks.register('orbFlightChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.truenins.validation.OrbFlightChecks'
}
tasks.named('check').configure { dependsOn 'orbFlightChecks' }
